project:
  name: myproject
domains:
  - hostname: www.example.com
  - hostname: www.example.sk
security:
  mcp:
    ipWhitelist:
      - 203.0.113.0/24
      - 198.51.100.10/32
app:
  env:
    DATABASE_HOST: "10.0.0.100"
    DATABASE_NAME: "myproject-production"
    DATABASE_PORT: "5432"
    DATABASE_USER: "myproject-production"
    S3_ENDPOINT: "https://s3.example.com"
    S3_ACCESS_KEY: "myproject-production"
    S3_BUCKET_NAME: "myproject-production"
    ELASTICSEARCH_HOST: "http://elasticsearch:9200"
    ELASTIC_SEARCH_INDEX_PREFIX: "myproject-production"
    REDIS_PREFIX: "myproject-production"
    MAILER_DSN: "smtp://mailhog:1025"
    TRUSTED_PROXY: "10.0.0.0/8"
    MESSENGER_TRANSPORT_DSN: "amqp://guest:guest@rabbitmq:5672/%2f/messages"
  s3Endpoint: "https://s3.example.com"
  secretEnv:
    APP_SECRET: "test-app-secret-key"
    DATABASE_PASSWORD: "test-db-password"
    S3_SECRET: "test-s3-secret"
cron:
  instances:
    - name: cron
      schedule: '*/5 * * * *'
consumers:
  instances:
    - name: email
      transports: email_transport
      replicas: 1
webserver:
  autoscaling:
    enabled: true
storefront:
  autoscaling:
    enabled: true
rabbitmq:
  management:
    ipWhitelist:
      - 10.0.0.0/8
networkPolicy:
  enabled: true
  monitoringNamespace:
    matchLabels:
      kubernetes.io/metadata.name: observability
  extraIngress:
    - from:
        - ipBlock:
            cidr: 192.168.0.0/16
  egress:
    enabled: true
    rules:
      - to:
          - ipBlock:
              cidr: 10.0.0.100/32
        ports:
          - port: 5432
      - to:
          - ipBlock:
              cidr: 10.96.0.1/32
        ports:
          - port: 443
