project:
  name: myproject-cloudflare
domains:
  - hostname: dev.example.com
security:
  whitelistIps:
    - 10.0.0.0/8
    - 192.168.0.0/16
  cloudflare:
    enabled: true
app:
  env:
    DATABASE_HOST: "10.0.0.100"
    DATABASE_NAME: "myproject-cloudflare-dev"
    DATABASE_PORT: "5432"
    DATABASE_USER: "myproject-cloudflare-dev"
    S3_ENDPOINT: "https://s3.example.com"
    S3_ACCESS_KEY: "myproject-cloudflare-dev"
    S3_BUCKET_NAME: "myproject-cloudflare-dev"
    ELASTICSEARCH_HOST: "http://elasticsearch:9200"
    ELASTIC_SEARCH_INDEX_PREFIX: "myproject-cloudflare-dev"
    REDIS_PREFIX: "myproject-cloudflare-dev"
    MAILER_DSN: "smtp://mailhog:1025"
    TRUSTED_PROXY: "10.0.0.0/8"
    MESSENGER_TRANSPORT_DSN: "amqp://guest:guest@rabbitmq:5672/%2f/messages"
  s3Endpoint: "https://s3.example.com"
  secretEnv:
    APP_SECRET: "test-app-secret-key"
    DATABASE_PASSWORD: "test-db-password"
    S3_SECRET: "test-s3-secret"
cron:
  instances:
    - name: cron
      schedule: '*/5 * * * *'
rabbitmq:
  management:
    ipWhitelist:
      - 10.0.0.0/8
