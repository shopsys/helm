  password: "rabbitmq-password"

---
# Source: shopsys-infra/templates/configmap-redis-health.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-health-configmap
  labels:
    app.kubernetes.io/name: shopsys-infra
    app.kubernetes.io/instance: shopsys-infra
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shopsys-infra-1.0.0
data:
  readiness.sh: |-
    response=$( redis-cli ping )
    if [ "$response" != "PONG" ]; then
      echo "$response"
      exit 1
    fi
  liveness.sh: |-
    response=$( redis-cli ping )
    if [ "$response" != "PONG" ] && [ "$response" != "LOADING Redis is loading the dataset in memory" ]; then
      echo "$response"
      exit 1
    fi

---
# Source: shopsys-infra/templates/configmap-redis.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: shopsys-infra
    app.kubernetes.io/instance: shopsys-infra
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shopsys-infra-1.0.0
data:
  redis.conf: |
    tcp-keepalive 30
    timeout 60
    loglevel notice
    maxmemory 2200mb
    maxmemory-policy volatile-lru
    
    # Disable AOF and RDB persistence as we keep everything in memory only, see https://redis.io/topics/persistence
    appendonly no
    # Disable RDB persistence, AOF persistence already disabled above.
    save ""
    
    # Enabling active memory defragmentation
    activedefrag yes
    

