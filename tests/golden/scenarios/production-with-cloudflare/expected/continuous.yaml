apiVersion: batch/v1
kind: Job
metadata:
  name: cron-suspend
  labels:
    app.kubernetes.io/name: shopsys-app
    app.kubernetes.io/instance: shopsys-app
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shopsys-app-1.0.0
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: deploy-hooks
      restartPolicy: Never
      containers:
        - name: cron-suspend
          image: "rancher/kubectl:v1.33.13"
          command:
            - /bin/sh
            - -c
            - |
              kubectl scale deployment/cron --replicas=0 --namespace=shop-production 2>/dev/null || true
              kubectl wait --for=delete pod -l app=cron --namespace=shop-production --timeout=3660s || true

