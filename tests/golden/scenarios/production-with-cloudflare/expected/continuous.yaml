apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-application
  labels:
    app.kubernetes.io/name: shopsys-app
    app.kubernetes.io/instance: shopsys-app
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shopsys-app-1.0.0
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    spec:
      volumes:
        - name: domains-urls
          configMap:
            name: domains-urls-hook
      containers:
        - name: migrate-application
          image: "v1.0.0"
          command: ["sh", "-c", "cd /var/www/html && ./phing -verbose db-migrations-count-with-maintenance build-deploy-part-2-db-dependent"]
          envFrom:
            - secretRef:
                name: app-secret-env-hook
          env:
            
            - name: DATABASE_HOST
              value: "10.0.0.100"
            - name: DATABASE_NAME
              value: "shop-production"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              value: "shop-production"
            - name: ELASTICSEARCH_HOST
              value: "http://elasticsearch:9200"
            - name: ELASTIC_SEARCH_INDEX_PREFIX
              value: "shop-production"
            - name: MAILER_DSN
              value: "smtp://mailhog:1025"
            - name: MAILER_FORCE_WHITELIST
              value: "false"
            - name: MESSENGER_TRANSPORT_DSN
              value: "amqp://guest:guest@rabbitmq:5672/%2f/messages"
            - name: REDIS_PREFIX
              value: "shop-production"
            - name: S3_ACCESS_KEY
              value: "shop-production"
            - name: S3_BUCKET_NAME
              value: "shop-production"
            - name: S3_ENDPOINT
              value: "https://s3.example.com"
            - name: TRUSTED_PROXY
              value: "10.0.0.0/8"
          volumeMounts:
            - name: domains-urls
              mountPath: /var/www/html/config/domains_urls.yaml
              subPath: "domains_urls.yaml"
      restartPolicy: Never
      imagePullSecrets:
        - name: dockerregistry

