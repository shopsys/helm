# Source: shopsys-app/templates/configmap-php-fpm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: production-php-fpm
  labels:
    app.kubernetes.io/name: shopsys-app
    app.kubernetes.io/instance: shopsys-app
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shopsys-app-1.0.0
data:
  www.conf: |
    ; The below default configuration is based on a server without much resources.
    ; Don't forget to tweak it to fit expected workload and hardware.
    ;
    ; https://www.php.net/manual/en/install.fpm.configuration.php
    [global]
    
    log_level = warning
    
    [www]
    
    listen = 127.0.0.1:9000
    
    pm = dynamic
    pm.max_children = 20
    pm.start_servers = 5
    pm.min_spare_servers = 5
    pm.max_spare_servers = 10
    pm.max_requests = 400
    
    request_terminate_timeout = 60s
    
    access.log = /dev/null
    

