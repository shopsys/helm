    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    spec:
      volumes:
        - name: domains-urls
          configMap:
            name: domains-urls-hook
      containers:
        - name: post-deploy
          image: "v1.0.0"
          command:
            - sh
            - -c
            - |
              set -e
              cd /var/www/html
              ./phing maintenance-off
              ./phing clean-redis-old || echo "[FAILED] clean-redis-old"
              ./phing clean-redis-storefront || echo "[FAILED] clean-redis-storefront"
              if ./phing -l 2>/dev/null | grep -q "build-deploy-part-3-non-blocking"; then
                ./phing build-deploy-part-3-non-blocking || echo "[FAILED] build-deploy-part-3-non-blocking"
              fi
          
          envFrom:
            - secretRef:
                name: app-secret-env
          env:
            
            - name: DATABASE_HOST
              value: "10.0.0.100"
            - name: DATABASE_NAME
              value: "shop-production"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              value: "shop-production"
            - name: ELASTICSEARCH_HOST
              value: "http://elasticsearch:9200"
            - name: ELASTIC_SEARCH_INDEX_PREFIX
              value: "shop-production"
            - name: MAILER_DSN
              value: "smtp://mailhog:1025"
            - name: MAILER_FORCE_WHITELIST
              value: "false"
            - name: MESSENGER_TRANSPORT_DSN
              value: "amqp://guest:guest@rabbitmq:5672/%2f/messages"
            - name: REDIS_PREFIX
              value: "shop-production"
            - name: S3_ACCESS_KEY
              value: "shop-production"
            - name: S3_BUCKET_NAME
              value: "shop-production"
            - name: S3_ENDPOINT
              value: "https://s3.example.com"
            - name: TRUSTED_PROXY
              value: "10.0.0.0/8"
          volumeMounts:
            - name: domains-urls
              mountPath: /var/www/html/config/domains_urls.yaml
              subPath: "domains_urls.yaml"
      restartPolicy: Never
