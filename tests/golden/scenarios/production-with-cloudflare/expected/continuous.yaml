---
# Source: shopsys-infra/templates/deployment-redis.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: shopsys-infra
    app.kubernetes.io/instance: shopsys-infra
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shopsys-infra-1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      annotations:
        logging/enabled: "false"
        project/app: "redis"
        project/environment: "production"
        project/name: "shop"
        checksum/redis-config: 81f63d0ecd9fa1305f6c4157058b05bd93792e15148d17fc4e542b9c24e33635
      labels:
        app: redis
    spec:
      
      volumes:
        - name: health
          configMap:
            name: redis-health-configmap
            defaultMode: 0755
        - name: config
          configMap:
            name: redis
            defaultMode: 0755
      containers:
        - name: redis
          image: "redis:7.4-alpine"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: health
              mountPath: /health
            - name: config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
          args:
            - /usr/local/etc/redis/redis.conf
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 5
            exec:
              command:
                - sh
                - -c
                - /health/liveness.sh 5
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 5
            exec:
              command:
                - sh
                - -c
                - /health/readiness.sh 5
          resources:
            limits:
              memory: 2500Mi
            requests:
              cpu: 100m
              memory: 2500Mi
        - name: redis-exporter
          image: "oliver006/redis_exporter:v1.89.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: exporter
              containerPort: 9121
              protocol: TCP
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 128Mi

---
# Source: shopsys-infra/templates/statefulset-rabbitmq.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: shopsys-infra
    app.kubernetes.io/instance: shopsys-infra
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shopsys-infra-1.0.0
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - rabbitmq
              topologyKey: kubernetes.io/hostname
            weight: 100
      imagePullSecrets:
        - name: dockerregistry
      containers:
        - name: rabbitmq
          image: "rabbitmq:4.1-management-alpine"
          ports:
            - name: rabbitmq
              containerPort: 15672
              protocol: TCP
            - name: exporter
              containerPort: 15692
              protocol: TCP
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: user
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
          resources:
            requests:
              cpu: 20m
          
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nfs-client
        resources:
          requests:
            storage: 1Gi

