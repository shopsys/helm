project:
  name: shop
domains:
  - hostname: www.shop.com
  - hostname: www.shop.de
security:
  cloudflare:
    enabled: true
app:
  env:
    DATABASE_HOST: "10.0.0.100"
    DATABASE_NAME: "shop-production"
    DATABASE_PORT: "5432"
    DATABASE_USER: "shop-production"
    S3_ENDPOINT: "https://s3.example.com"
    S3_ACCESS_KEY: "shop-production"
    S3_BUCKET_NAME: "shop-production"
    ELASTICSEARCH_HOST: "http://elasticsearch:9200"
    ELASTIC_SEARCH_INDEX_PREFIX: "shop-production"
    REDIS_PREFIX: "shop-production"
    MAILER_DSN: "smtp://mailhog:1025"
    TRUSTED_PROXY: "10.0.0.0/8"
    MESSENGER_TRANSPORT_DSN: "amqp://guest:guest@rabbitmq:5672/%2f/messages"
  s3Endpoint: "https://s3.example.com"
  secretEnv:
    APP_SECRET: "test-app-secret-key"
    DATABASE_PASSWORD: "test-db-password"
    S3_SECRET: "test-s3-secret"
cron:
  instances:
    - name: cron
      schedule: '*/5 * * * *'
    - name: feed-generator
      schedule: '0 */2 * * *'
consumers:
  instances:
    - name: email
      transports: email_transport
      replicas: 2
    - name: order
      transports: order_transport
      replicas: 3
webserver:
  autoscaling:
    enabled: true
storefront:
  autoscaling:
    enabled: true
rabbitmq:
  management:
    ipWhitelist:
      - 10.0.0.0/8
