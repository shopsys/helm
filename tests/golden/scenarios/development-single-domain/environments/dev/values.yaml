# Development behavior (legacy RUNNING_PRODUCTION=0): HTTP auth, mailer whitelist,
# minimal CPU requests and HPA pinned to 2 replicas.
security:
  httpAuth:
    enabled: true
    # golden determinism: the generated htpasswd hash is salted, so scenarios must
    # reference an existing secret instead of username/password
    existingSecret: http-auth
app:
  envDefaults:
    MAILER_FORCE_WHITELIST: "true"
webserver:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 2
  phpFpm:
    resources:
      requests:
        cpu: "0.01"
        memory: 100Mi
  nginx:
    resources:
      requests:
        cpu: "0.01"
storefront:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 2
  resources:
    requests:
      cpu: "0.01"
redis:
  resources:
    requests:
      cpu: "0.01"
      memory: 100Mi
rabbitmq:
  resources:
    requests:
      cpu: "0.01"
