# Production environment.

# The base enables HTTP basic auth for every environment; production is public.
security:
  httpAuth:
    enabled: false

webserver:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3

storefront:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
