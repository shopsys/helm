{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    {{- include "shopsys.labels" $ | nindent 4 }}
    app: rabbitmq
    prometheus-exporter: 'true'
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: rabbitmq
      port: 5672
      targetPort: 5672
    - name: rabbitmq-management
      port: 15672
      targetPort: 15672
    - name: prometheus-exporter
      port: 15692
      targetPort: 15692
{{- end }}
