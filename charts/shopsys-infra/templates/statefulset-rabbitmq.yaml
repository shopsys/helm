{{- if .Values.rabbitmq.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    {{- include "shopsys.labels" $ | nindent 4 }}
spec:
  serviceName: rabbitmq
  replicas: {{ .Values.rabbitmq.replicas }}
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      {{- with .Values.rabbitmq.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: rabbitmq
        {{- with .Values.rabbitmq.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "shopsys.podSettings" (dict "root" $ "component" .Values.rabbitmq) | nindent 6 }}
      containers:
        - name: rabbitmq
          image: {{ include "shopsys.image" .Values.rabbitmq.image | quote }}
          {{- with .Values.rabbitmq.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          ports:
            - name: rabbitmq
              containerPort: 15672
              protocol: TCP
            - name: exporter
              containerPort: 15692
              protocol: TCP
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: user
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            {{- with .Values.rabbitmq.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          {{- with .Values.rabbitmq.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.rabbitmq.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.rabbitmq.livenessProbe | nindent 12 }}
          {{- else }}
          {{- /* Stage-1 health check (https://www.rabbitmq.com/docs/monitoring#health-checks):
               validates the runtime is up and CLI authentication works. rabbitmq-diagnostics
               spawns an Erlang VM, so the budget is deliberately generous - a false positive
               here costs a full broker restart. */}}
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          {{- end }}
          {{- if .Values.rabbitmq.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.rabbitmq.readinessProbe | nindent 12 }}
          {{- else }}
          {{- /* The AMQP listener opens as one of the last boot steps, so a TCP check on 5672
               is exactly "the broker accepts connections" - the upstream Kubernetes
               Operator's default and the practice recommended by the RabbitMQ docs (CLI
               checks are explicitly discouraged as readiness probes). */}}
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            {{- with .Values.rabbitmq.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.rabbitmq.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.rabbitmq.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.persistence.size }}
{{- end }}
