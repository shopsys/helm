{{- /*
RabbitMQ credentials as a Secret - the StatefulSet consumes them via secretKeyRef so
the plaintext values never appear in the pod spec.
*/}}
{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  labels:
    {{- include "shopsys.labels" $ | nindent 4 }}
type: Opaque
stringData:
  user: {{ .Values.rabbitmq.auth.user | quote }}
  password: {{ .Values.rabbitmq.auth.password | quote }}
{{- end }}
