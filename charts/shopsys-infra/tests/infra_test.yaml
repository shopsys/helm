suite: infrastructure services
values:
  - ./values/required.yaml
templates:
  - templates/deployment-redis.yaml
  - templates/statefulset-rabbitmq.yaml
  - templates/ingress-rabbitmq.yaml
  - templates/rbac-deploy-hooks.yaml
  - templates/secret-rabbitmq.yaml
  - templates/serviceaccount.yaml
tests:
  - it: runs redis as the first container with the exporter sidecar and health probes
    template: templates/deployment-redis.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: redis
      - equal:
          path: spec.template.spec.containers[0].image
          value: "redis:7.4-alpine"
      - equal:
          path: spec.template.spec.containers[1].name
          value: redis-exporter
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: liveness.sh

  - it: provisions rabbitmq with persistent storage and credentials
    template: templates/statefulset-rabbitmq.yaml
    set:
      rabbitmq:
        auth:
          user: admin
          password: secret
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: nfs-client
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RABBITMQ_DEFAULT_USER
            valueFrom:
              secretKeyRef:
                name: rabbitmq-credentials
                key: user

  - it: derives the management hostname from the first domain
    template: templates/ingress-rabbitmq.yaml
    set:
      domains:
        - hostname: www.example.com
      rabbitmq:
        management:
          ipWhitelist:
            - 10.0.0.0/8
    asserts:
      - equal:
          path: spec.rules[0].host
          value: rabbitmq.www.example.com
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/whitelist-source-range"]
          value: 10.0.0.0/8

  - it: prefers an explicit management hostname
    template: templates/ingress-rabbitmq.yaml
    set:
      rabbitmq:
        management:
          hostname: mq.example.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: mq.example.com

  - it: ships RBAC for the deploy hook jobs
    template: templates/rbac-deploy-hooks.yaml
    asserts:
      - hasDocuments:
          count: 3

  - it: stores rabbitmq credentials in a secret
    template: templates/secret-rabbitmq.yaml
    set:
      rabbitmq:
        auth:
          user: admin
          password: secret
    asserts:
      - equal:
          path: stringData.user
          value: admin
      - equal:
          path: stringData.password
          value: secret

  - it: runs redis fully unprivileged with a read-only root filesystem
    template: templates/deployment-redis.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[1].securityContext.capabilities.drop[0]
          value: ALL

  - it: hardens rabbitmq without switching its user
    template: templates/statefulset-rabbitmq.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - notExists:
          path: spec.template.spec.securityContext.runAsNonRoot

  - it: runs infra pods under the chart ServiceAccount without token automount
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.name
          value: shopsys-infra
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: assigns the ServiceAccount to the rabbitmq pod
    template: templates/statefulset-rabbitmq.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: shopsys-infra
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
