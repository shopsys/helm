suite: infrastructure services
values:
  - ./values/required.yaml
templates:
  - templates/deployment-redis.yaml
  - templates/statefulset-rabbitmq.yaml
  - templates/ingress-rabbitmq.yaml
  - templates/rbac-deploy-hooks.yaml
  - templates/secret-rabbitmq.yaml
tests:
  - it: runs redis as the first container with the exporter sidecar and health probes
    template: templates/deployment-redis.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: redis
      - equal:
          path: spec.template.spec.containers[0].image
          value: "redis:7.4-alpine"
      - equal:
          path: spec.template.spec.containers[1].name
          value: redis-exporter
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: liveness.sh

  - it: provisions rabbitmq with persistent storage and credentials
    template: templates/statefulset-rabbitmq.yaml
    set:
      rabbitmq:
        auth:
          user: admin
          password: secret
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: nfs-client
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RABBITMQ_DEFAULT_USER
            valueFrom:
              secretKeyRef:
                name: rabbitmq-credentials
                key: user

  - it: gives rabbitmq default probes so infra readiness means an accepting broker
    template: templates/statefulset-rabbitmq.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3

  - it: replaces the default rabbitmq probes wholesale when they are set
    template: templates/statefulset-rabbitmq.yaml
    set:
      rabbitmq:
        livenessProbe:
          exec:
            command:
              - rabbitmq-diagnostics
              - -q
              - check_running
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/health/checks/alarms
            port: 15672
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - check_running
            periodSeconds: 20
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: /api/health/checks/alarms
              port: 15672

  - it: renders the rabbitmq container securityContext next to the probes
    template: templates/statefulset-rabbitmq.yaml
    set:
      rabbitmq:
        securityContext:
          runAsNonRoot: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - exists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: derives the management hostname from the first domain
    template: templates/ingress-rabbitmq.yaml
    set:
      domains:
        - hostname: www.example.com
      rabbitmq:
        management:
          ipWhitelist:
            - 10.0.0.0/8
    asserts:
      - equal:
          path: spec.rules[0].host
          value: rabbitmq.www.example.com
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/whitelist-source-range"]
          value: 10.0.0.0/8

  - it: prefers an explicit management hostname
    template: templates/ingress-rabbitmq.yaml
    set:
      rabbitmq:
        management:
          hostname: mq.example.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: mq.example.com

  - it: ships RBAC for the deploy hook jobs
    template: templates/rbac-deploy-hooks.yaml
    asserts:
      - hasDocuments:
          count: 3

  - it: stores rabbitmq credentials in a secret
    template: templates/secret-rabbitmq.yaml
    set:
      rabbitmq:
        auth:
          user: admin
          password: secret
    asserts:
      - equal:
          path: stringData.user
          value: admin
      - equal:
          path: stringData.password
          value: secret
