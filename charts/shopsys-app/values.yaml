# Default values for shopsys-app.
#
# Every workload component (webserver, storefront, cron, consumers) exposes the same
# standard keys: image {repository, tag, pullPolicy}, replicas, resources, podAnnotations,
# podLabels, nodeSelector, tolerations, affinity, topologySpreadConstraints, extraEnv,
# extraVolumes, extraVolumeMounts,
# livenessProbe/readinessProbe, securityContext/podSecurityContext, lifecycle,
# terminationGracePeriodSeconds, priorityClassName. Webserver and storefront additionally
# expose independent `autoscaling` sections.

project:
  name: ""          # REQUIRED - project name; namespace is <name>-<environment>
  environment: ""   # injected by helmfile from the selected environment

# Ordered list of e-shop domains (index 0 = legacy DOMAIN_HOSTNAME_1).
# hostname may contain a path for path-based domains, e.g. "example.com/en".
domains: []
#  - hostname: www.example.com
#    forceHttpAuth: false        # protect this domain by HTTP basic auth even when
#                                # security.httpAuth.enabled is false (legacy FORCE_HTTP_AUTH_IN_PRODUCTION)
#    cloudflareExcluded: false   # exclude from Cloudflare handling (legacy CLOUDFLARE_EXCLUDED_DOMAINS)
#    extraAnnotations: {}        # extra annotations for this domain's ingress

ingress:
  className: nginx
  clusterIssuer: letsencrypt-prod
  proxyBodySize: 32m
  extraAnnotations: {}   # applied to every e-shop domain ingress

security:
  httpAuth:
    enabled: false       # enable HTTP basic auth on all domains (legacy RUNNING_PRODUCTION=0 behavior)
    # Credentials the chart generates the htpasswd entry (bcrypt) from. Required when
    # auth is active, unless existingSecret is set. The generated hash uses a random
    # salt, so it is NOT deterministic across renders - golden test scenarios must use
    # existingSecret instead.
    username: ""
    password: ""
    # Name of an externally managed secret with an `auth` key; when set, the chart does
    # not render the http-auth secret and the ingress auth-secret annotation points here.
    existingSecret: ""
  # IPs allowed to bypass HTTP basic auth (legacy DEFAULT_WHITELIST_IPS + WHITELIST_IPS)
  whitelistIps: []
  cloudflare:
    enabled: false       # legacy USING_CLOUDFLARE - sets real_ip_header CF-Connecting-IP
  mcp:
    enabled: true        # publish MCP endpoints through a separate ingress without basic auth
    ipWhitelist: []      # source ranges allowed to reach MCP; empty = unrestricted
  feApiKeys:
    # Optional declarative FE API keypair. When both are set the chart renders the
    # fe-api-keys secret; otherwise the deploy wrapper generates it once via openssl.
    privateKey: ""
    publicKey: ""

registry:
  create: true           # create the dockerregistry image pull secret
  server: ""             # sensitive/CI - provide via environment interpolation
  username: ""
  password: ""
  email: ""
  # Name of an externally managed image pull secret; when set, the chart does not render
  # the dockerregistry secret and pods reference this name instead.
  existingSecret: ""

imagePullSecrets:
  - dockerregistry

# ServiceAccount the workload pods run under (the hook Jobs keep the deploy-hooks SA).
# None of the workloads talk to the Kubernetes API, so the token is not mounted.
# NOTE: the helmfile passes these values to both charts - leave `name` empty (each chart
# defaults to its own chart name) or set create=false with an externally managed account;
# an explicit name with create=true would make both releases fight over one ServiceAccount.
serviceAccount:
  create: true
  name: ""              # generated from the chart name when empty
  automountToken: false

app:
  # Backend environment variables (webserver, cron, consumers, migration job, cron shell).
  # Values MUST be strings - quote values like "479411e7" in YAML.
  env: {}
  # Sensitive backend variables - rendered as the app-secret-env Secret and injected via
  # envFrom (never as plain values in pod specs or ConfigMaps). Cron jobs source them from
  # the mounted .project_secret_env.sh. Values must be strings. NOTE: explicit env entries
  # take precedence over envFrom - do not define a key in both env and secretEnv.
  # Rollout checksums are derived from the secret content (standard Helm pattern): a
  # principal with pod-read but no secret-read access could use the digest to verify
  # guesses of low-entropy values - always use strong generated secrets.
  secretEnv: {}
  # Chart-provided defaults; environment overlays override them (dev sets "true").
  envDefaults:
    MAILER_FORCE_WHITELIST: "false"
  domainsUrls:
    filename: domains_urls.yaml
    mountPath: config/domains_urls.yaml
  adminUrl: admin
  s3Endpoint: ""

webserver:
  image:
    repository: ""       # application image (shared by cron, consumers and migration job);
    tag: ""              # CI provides one full reference in repository, tag stays empty
    pullPolicy: IfNotPresent
  replicas: 1            # omitted from the manifest when autoscaling.enabled
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilization: 120
  # PodDisruptionBudget protecting against voluntary disruptions (node drains). Rendered
  # only when the component runs 2+ replicas (autoscaling enabled or replicas > 1) - a
  # minAvailable: 1 budget on a single replica would block drains forever.
  pdb:
    enabled: true
    minAvailable: 1
  progressDeadlineSeconds: 1500
  terminationGracePeriodSeconds: 120
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  phpFpm:
    # The application image's user is project-specific, so only settings that are safe
    # for both root and non-root processes are defaulted here; runAsNonRoot /
    # readOnlyRootFilesystem are opt-in per project after verifying the image.
    securityContext:
      allowPrivilegeEscalation: false
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: "500m"
        memory: 500Mi
    extraVolumeMounts: []
    # php-fpm pool configuration (www.conf)
    config: |
      ; The below default configuration is based on a server without much resources.
      ; Don't forget to tweak it to fit expected workload and hardware.
      ;
      ; https://www.php.net/manual/en/install.fpm.configuration.php
      [global]

      log_level = warning

      [www]

      listen = 127.0.0.1:9000

      pm = dynamic
      pm.max_children = 20
      pm.start_servers = 5
      pm.min_spare_servers = 5
      pm.max_spare_servers = 10
      pm.max_requests = 400

      request_terminate_timeout = 60s

      access.log = /dev/null
    # opcache configuration (php-opcache.ini)
    opcacheConfig: |
      opcache.enable = 1
      opcache.fast_shutdown = true
      opcache.interned_strings_buffer = 24
      opcache.max_accelerated_files = 60000
      opcache.memory_consumption = 256
      opcache.revalidate_path = 0
      opcache.revalidate_freq = 0
      opcache.validate_timestamps = 0
      opcache.use_cwd = 0
      opcache.preload = "/var/www/html/app/preload.php"
  nginx:
    image:
      repository: nginx
      tag: 1.29-alpine
      pullPolicy: ""
    # Port of the stub_status health server (probes); must stay above 1024 because
    # nginx runs unprivileged.
    healthPort: 8081
    # nginx runs fully hardened: the chart-shipped nginx.conf uses /tmp for the pid file
    # and the pod mounts emptyDirs over /var/cache/nginx and /tmp for the read-only root.
    securityContext:
      runAsNonRoot: true
      runAsUser: 101       # nginx user of the stock image
      runAsGroup: 101
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
    resources:
      limits:
        memory: 300Mi
      requests:
        cpu: "50m"
        memory: 100Mi
    # nginx.conf / vhost content; empty = chart defaults from files/nginx/ (templated with tpl)
    config: ""
    projectConfig: ""
    extraVolumeMounts: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: "kubernetes.io/hostname"
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - webserver-php-fpm
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: "kubernetes.io/hostname"
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - redis
  topologySpreadConstraints: []
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  extraEnv: []
  extraVolumes: []
  priorityClassName: ""

storefront:
  image:
    repository: ""       # storefront image; CI provides one full reference, tag stays empty
    tag: ""
    pullPolicy: ""
  env: {}                # storefront environment variables (values must be strings)
  # Sensitive storefront variables - rendered as the storefront-secret-env Secret (envFrom)
  secretEnv: {}
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilization: 120
  # See webserver.pdb - same gating (autoscaling enabled or replicas > 1).
  pdb:
    enabled: true
    minAvailable: 1
  terminationGracePeriodSeconds: 60
  resources:
    limits:
      memory: "1.5Gi"
    requests:
      cpu: "500m"
      memory: "800Mi"
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
  lifecycle:
    preStop:
      exec:
        command:
          - sleep
          - '10'
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: "kubernetes.io/hostname"
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - storefront
  topologySpreadConstraints: []
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  # The storefront image's user is project-specific - see webserver.phpFpm.securityContext.
  securityContext:
    allowPrivilegeEscalation: false
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  priorityClassName: ""

cron:
  enabled: true
  # Cron instances: name is the phing target, schedule is a crontab expression.
  instances: []
  #  - name: cron
  #    schedule: '*/5 * * * *'
  # The cron pod drains itself on termination (preStop: cron-lock + cron-watch);
  # must exceed the runtime of the longest cron instance.
  terminationGracePeriodSeconds: 3600
  progressDeadlineSeconds: 1500
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  # Conservative defaults (same PHP application image as the webserver); tune per project
  # from real metrics. The legacy package shipped no requests/limits (BestEffort pods).
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: "100m"
      memory: 300Mi
  securityContext:
    runAsUser: 0
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "background"
      effect: "NoSchedule"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: workload
                operator: In
                values:
                  - background
  topologySpreadConstraints: []
  podSecurityContext: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  priorityClassName: ""

consumers:
  # Defaults shared by all consumer instances; every key can be overridden per instance.
  defaults:
    replicas: 1
    timeLimit: 300
    terminationGracePeriodSeconds: 300
    progressDeadlineSeconds: 600
    # Conservative defaults (same PHP application image as the webserver); override per
    # instance or per environment. The legacy package shipped no requests/limits.
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: "50m"
        memory: 300Mi
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "background"
        effect: "NoSchedule"
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: workload
                  operator: In
                  values:
                    - background
    topologySpreadConstraints: []
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    # The application image's user is project-specific - see webserver.phpFpm.securityContext.
    securityContext:
      allowPrivilegeEscalation: false
    extraEnv: []
    extraVolumes: []
    extraVolumeMounts: []
    priorityClassName: ""
  # Consumer instances: name, transports (space-separated messenger transports), replicas.
  instances: []
  #  - name: email
  #    transports: email_transport
  #    replicas: 1

deploy:
  # Forces the cron pod to restart on every deploy; the wrapper passes the current
  # timestamp, golden tests pin "1234567890". Falls back to the release revision.
  timestamp: ""
  firstDeploy:
    enabled: false       # first deploy of the project instance (legacy FIRST_DEPLOY=1)
    loadDemoData: false  # load demo data during the first deploy
  migration:
    enabled: true
    # Phing targets executed by the migrate-application hook Job
    targets:
      continuous: "-verbose db-migrations-count-with-maintenance build-deploy-part-2-db-dependent"
      firstDeploy: "cluster-first-deploy"
      firstDeployWithDemoData: "cluster-first-deploy db-fixtures-demo plugin-demo-data-load friendly-urls-generate domains-urls-replace elasticsearch-export"
    resources: {}
  postDeploy:
    enabled: true
    resources: {}
  hooks:
    # kubectlImage is the image used by the cron-suspend hook Job; pinned tag on purpose
    # (bitnami/kubectl moved to the unmaintained bitnamilegacy distribution in 2025)
    kubectlImage: rancher/kubectl:v1.33.13
    serviceAccountName: deploy-hooks

# Additional raw manifests rendered through tpl (escape hatch for project additions).
extraManifests: []
