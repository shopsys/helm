suite: deploy hooks
values:
  - ./values/required.yaml
templates:
  - templates/hooks/job-migrate-application.yaml
  - templates/hooks/job-cron-suspend.yaml
  - templates/hooks/job-post-deploy.yaml
  - templates/hooks/secret-app-env-hook.yaml
tests:
  - it: runs the migration before install and upgrade, keeps the job for logs
    template: templates/hooks/job-migrate-application.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "10"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      - equal:
          path: spec.backoffLimit
          value: 0
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'db-migrations-count-with-maintenance build-deploy-part-2-db-dependent'

  - it: switches the command on first deploy
    template: templates/hooks/job-migrate-application.yaml
    set:
      deploy:
        firstDeploy:
          enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'sleep 30 && \./phing cluster-first-deploy$'

  - it: loads demo data on first deploy when requested
    template: templates/hooks/job-migrate-application.yaml
    set:
      deploy:
        firstDeploy:
          enabled: true
          loadDemoData: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'cluster-first-deploy db-fixtures-demo plugin-demo-data-load friendly-urls-generate domains-urls-replace elasticsearch-export'

  - it: suspends crons only on upgrades and scales via the hook service account
    template: templates/hooks/job-cron-suspend.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - equal:
          path: spec.template.spec.serviceAccountName
          value: deploy-hooks
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'kubectl scale deployment/cron --replicas=0'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'kubectl wait --for=delete pod -l app=cron .* --timeout=3660s'

  - it: runs the cron-suspend script with a shell-capable kubectl image
    template: templates/hooks/job-cron-suspend.yaml
    asserts:
      # the script relies on "|| true" tolerance, so the image must provide /bin/sh
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: /bin/sh
      - equal:
          path: spec.template.spec.containers[0].image
          value: alpine/k8s:1.33.13

  - it: runs post-deploy tasks with legacy ERROR/FAILED semantics
    template: templates/hooks/job-post-deploy.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'set -e'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: './phing maintenance-off\n'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: './phing clean-redis-old \|\| echo'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'build-deploy-part-3-non-blocking \|\| echo'

  - it: gives the migration job a hook-scoped secret env copy
    set:
      app:
        secretEnv:
          DATABASE_PASSWORD: "s3cret"
    asserts:
      - template: templates/hooks/secret-app-env-hook.yaml
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "5"
      - template: templates/hooks/secret-app-env-hook.yaml
        equal:
          path: stringData.DATABASE_PASSWORD
          value: "s3cret"
      - template: templates/hooks/job-migrate-application.yaml
        contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: app-secret-env-hook
      - template: templates/hooks/job-post-deploy.yaml
        contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: app-secret-env

  - it: renders an empty scrub hook secret without secretEnv
    template: templates/hooks/secret-app-env-hook.yaml
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: stringData
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
