suite: standard component keys
values:
  - ./values/required.yaml
templates:
  - templates/deployment-storefront.yaml
  - templates/deployment-webserver-php-fpm.yaml
  - templates/deployment-consumer.yaml
tests:
  - it: propagates scheduling and volume keys into the pod spec
    template: templates/deployment-storefront.yaml
    set:
      storefront:
        nodeSelector:
          disktype: ssd
        tolerations:
          - key: dedicated
            operator: Equal
            value: storefront
            effect: NoSchedule
        priorityClassName: high-priority
        extraVolumes:
          - name: scratch
            emptyDir: {}
        extraVolumeMounts:
          - name: scratch
            mountPath: /scratch
        extraEnv:
          - name: FROM_FIELD
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated
      - equal:
          path: spec.template.spec.priorityClassName
          value: high-priority
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scratch
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: scratch
            mountPath: /scratch
      - equal:
          path: spec.template.spec.containers[0].env[-1].name
          value: FROM_FIELD

  - it: propagates topologySpreadConstraints into the pod spec
    template: templates/deployment-storefront.yaml
    set:
      storefront:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: storefront
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1

  - it: allows probe overrides
    template: templates/deployment-storefront.yaml
    set:
      storefront:
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz

  - it: replaces the dockerregistry pull secret with an existing one
    template: templates/deployment-webserver-php-fpm.yaml
    set:
      registry:
        existingSecret: my-pull-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: my-pull-secret
      - notContains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: dockerregistry

  - it: still references the existing pull secret when imagePullSecrets omits the placeholder
    template: templates/deployment-webserver-php-fpm.yaml
    set:
      imagePullSecrets: []
      registry:
        existingSecret: my-pull-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: my-pull-secret

  - it: does not duplicate an explicitly listed existing pull secret
    template: templates/deployment-webserver-php-fpm.yaml
    set:
      imagePullSecrets:
        - my-pull-secret
        - other-secret
      registry:
        existingSecret: my-pull-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: my-pull-secret
            - name: other-secret

  - it: ships default consumer resources and lets an instance override them
    template: templates/deployment-consumer.yaml
    set:
      consumers:
        instances:
          - name: email
            transports: email_transport
          - name: heavy
            transports: heavy_transport
            resources:
              requests:
                cpu: "500m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              memory: 1Gi
            requests:
              cpu: "50m"
              memory: 300Mi
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "500m"
        documentIndex: 1

  - it: propagates pod annotations and labels
    template: templates/deployment-webserver-php-fpm.yaml
    set:
      webserver:
        podAnnotations:
          example.com/scrape: "true"
        podLabels:
          team: platform
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.labels.team
          value: platform
