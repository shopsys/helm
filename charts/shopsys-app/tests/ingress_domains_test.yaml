suite: e-shop domain ingresses
values:
  - ./values/required.yaml
templates:
  - templates/ingress-domains.yaml
tests:
  - it: renders one ingress per domain with www redirect direction
    set:
      domains:
        - hostname: www.example.com
        - hostname: example.sk
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: eshop-domain-0
      - documentIndex: 0
        matchRegex:
          path: metadata.annotations["nginx.ingress.kubernetes.io/configuration-snippet"]
          pattern: 'return 308 https://www\.\$domain\$request_uri'
      - documentIndex: 0
        equal:
          path: spec.rules[1].host
          value: example.com
      - documentIndex: 1
        matchRegex:
          path: metadata.annotations["nginx.ingress.kubernetes.io/configuration-snippet"]
          pattern: '\^www\\\.'
      - documentIndex: 1
        equal:
          path: spec.rules[1].host
          value: www.example.sk
      - documentIndex: 1
        equal:
          path: spec.tls[0].secretName
          value: tls-example-sk

  - it: supports path-based domains
    set:
      domains:
        - hostname: example.com/en
    asserts:
      - equal:
          path: spec.rules[0].host
          value: example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /en
      - equal:
          path: spec.tls[0].secretName
          value: tls-example-com

  - it: adds basic auth with whitelist bypass when httpAuth is enabled
    set:
      security:
        httpAuth:
          enabled: true
        whitelistIps:
          - 10.0.0.0/8
          - 192.168.0.0/16
      domains:
        - hostname: dev.example.com
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/auth-type"]
          value: basic
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/auth-secret"]
          value: http-auth
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/whitelist-source-range"]
          value: 10.0.0.0/8,192.168.0.0/16
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/satisfy"]
          value: any

  - it: points the auth-secret annotation to an existing secret when referenced
    set:
      security:
        httpAuth:
          enabled: true
          existingSecret: my-auth
      domains:
        - hostname: dev.example.com
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/auth-secret"]
          value: my-auth

  - it: forces basic auth per domain even when globally disabled
    set:
      domains:
        - hostname: www.example.com
        - hostname: www.example.sk
          forceHttpAuth: true
    asserts:
      - documentIndex: 0
        notExists:
          path: metadata.annotations["nginx.ingress.kubernetes.io/auth-type"]
      - documentIndex: 1
        equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/auth-type"]
          value: basic

  - it: sets Cloudflare real_ip_header except for excluded domains
    set:
      security:
        cloudflare:
          enabled: true
      domains:
        - hostname: www.example.com
        - hostname: www.example.sk
          cloudflareExcluded: true
    asserts:
      - documentIndex: 0
        equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/server-snippet"]
          value: real_ip_header CF-Connecting-IP;
      - documentIndex: 1
        notExists:
          path: metadata.annotations["nginx.ingress.kubernetes.io/server-snippet"]
