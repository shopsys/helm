suite: secrets
values:
  - ./values/required.yaml
templates:
  - templates/secret-http-auth.yaml
  - templates/secret-dockerregistry.yaml
  - templates/secret-fe-api-keys.yaml
  - templates/secret-app-env.yaml
  - templates/secret-storefront-env.yaml
tests:
  - it: generates the htpasswd entry from username and password
    template: templates/secret-http-auth.yaml
    set:
      security:
        httpAuth:
          enabled: true
          username: admin
          password: s3cret
    asserts:
      - matchRegex:
          path: stringData.auth
          pattern: '^admin:\$2[aby]\$'

  - it: renders http-auth when any domain forces auth
    template: templates/secret-http-auth.yaml
    set:
      security:
        httpAuth:
          username: admin
          password: s3cret
      domains:
        - hostname: www.example.com
          forceHttpAuth: true
    asserts:
      - hasDocuments:
          count: 1

  - it: renders no http-auth without auth enabled
    template: templates/secret-http-auth.yaml
    set:
      security:
        httpAuth:
          username: admin
          password: s3cret
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when auth is enabled without credentials or an existing secret
    template: templates/secret-http-auth.yaml
    set:
      security:
        httpAuth:
          enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "HTTP basic auth is enabled but has no credentials"

  - it: renders no http-auth secret when an existing secret is referenced
    template: templates/secret-http-auth.yaml
    set:
      security:
        httpAuth:
          enabled: true
          existingSecret: my-auth
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no dockerregistry secret when an existing pull secret is referenced
    template: templates/secret-dockerregistry.yaml
    set:
      registry:
        server: registry.example.com
        username: user
        password: pass
        existingSecret: my-pull-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: builds a dockerconfigjson pull secret
    template: templates/secret-dockerregistry.yaml
    set:
      registry:
        server: registry.example.com
        username: user
        password: pass
    asserts:
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      - exists:
          path: data[".dockerconfigjson"]

  - it: renders fe-api-keys only when both keys are provided declaratively
    template: templates/secret-fe-api-keys.yaml
    set:
      security:
        feApiKeys:
          privateKey: "PRIVATE"
          publicKey: "PUBLIC"
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: stringData["private.key"]
          value: "PRIVATE"

  - it: renders no fe-api-keys by default (generated by the deploy wrapper)
    template: templates/secret-fe-api-keys.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the app secret env and the cron secret file
    template: templates/secret-app-env.yaml
    set:
      app:
        secretEnv:
          DATABASE_PASSWORD: "it's&secret"
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: stringData.DATABASE_PASSWORD
          value: "it's&secret"
      - documentIndex: 1
        matchRegex:
          path: stringData[".project_secret_env.sh"]
          pattern: "export DATABASE_PASSWORD='it'\\\\''s&secret'"

  - it: renders no app secret env by default
    template: templates/secret-app-env.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the storefront secret env
    template: templates/secret-storefront-env.yaml
    set:
      storefront:
        secretEnv:
          SENTRY_DSN: "https://x@sentry.example.com/1"
    asserts:
      - equal:
          path: stringData.SENTRY_DSN
          value: "https://x@sentry.example.com/1"
