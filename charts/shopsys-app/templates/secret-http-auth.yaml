{{- /*
Chart-managed htpasswd secret for HTTP basic auth, generated from
security.httpAuth.username + password (bcrypt via the Sprig htpasswd function).
Not rendered when the project references an externally managed secret
(security.httpAuth.existingSecret).
*/}}
{{- if and (include "shopsys.httpAuthNeeded" .) (not .Values.security.httpAuth.existingSecret) }}
{{- $content := include "shopsys.httpAuthContent" . }}
{{- if not $content }}
{{- fail "HTTP basic auth is enabled but has no credentials: set security.httpAuth.username + password, or reference security.httpAuth.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: http-auth
  labels:
    {{- include "shopsys.labels" $ | nindent 4 }}
type: Opaque
stringData:
  auth: {{ $content | quote }}
{{- end }}
