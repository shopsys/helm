{{- /*
Chart-managed htpasswd secret for HTTP basic auth. Not rendered when the project
references an externally managed secret (security.httpAuth.existingSecret).
Content: raw security.httpAuth.htpasswd wins; otherwise it is generated from
security.httpAuth.username + password (bcrypt via the Sprig htpasswd function).
*/}}
{{- $content := include "shopsys.httpAuthContent" . }}
{{- if and (include "shopsys.httpAuthNeeded" .) (not .Values.security.httpAuth.existingSecret) $content }}
apiVersion: v1
kind: Secret
metadata:
  name: http-auth
  labels:
    {{- include "shopsys.labels" $ | nindent 4 }}
type: Opaque
stringData:
  auth: {{ $content | quote }}
{{- end }}
