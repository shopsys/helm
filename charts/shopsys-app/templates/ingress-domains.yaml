{{- range $i, $d := .Values.domains }}
{{- $base := include "shopsys.domain.base" $d.hostname }}
{{- $path := include "shopsys.domain.path" $d.hostname }}
{{- $redirect := include "shopsys.domain.redirect" $d.hostname }}
{{- $tlsSecret := include "shopsys.domain.tlsSecretName" $d.hostname }}
{{- $httpAuth := include "shopsys.domain.httpAuthEnabled" (dict "root" $ "domain" $d) }}
{{- $cloudflare := include "shopsys.domain.cloudflareEnabled" (dict "root" $ "domain" $d) }}
{{- $whitelist := include "shopsys.whitelistIps" $ }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eshop-domain-{{ $i }}
  labels:
    {{- include "shopsys.labels" $ | nindent 4 }}
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $.Values.ingress.proxyBodySize }}
    {{- /* Redirect http to https and redirect between the www and non-www variant of the
           domain. The default "snippet" style guarantees the https-first chain - the
           built-in redirect annotations redirect BEFORE the HTTPS upgrade, producing an
           insecure http->http->https chain (kubernetes/ingress-nginx#10024 for
           from-to-www-redirect; #6340 for app-root - both unresolved).
           It requires allow-snippet-annotations: true on the controller; the "native"
           style is the fallback for locked-down controllers (note: the Cloudflare
           server-snippet below is also rejected by such controllers). In native mode the
           explicit nginx-prefixed ssl-redirect is required - the legacy-prefixed
           annotation above is not read by ingress-nginx, and without it the https
           upgrade would silently rely on the controller's global ssl-redirect default. */}}
    {{- if eq $.Values.ingress.redirectStyle "native" }}
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- else if hasPrefix "www." $base }}
    nginx.ingress.kubernetes.io/configuration-snippet: {{ `if ($scheme = http) { return 308 https://$host$request_uri; } if ($host ~ ^(?!www\.)(?<domain>.+)$) { return 308 https://www.$domain$request_uri; }` | quote }}
    {{- else }}
    nginx.ingress.kubernetes.io/configuration-snippet: {{ `if ($scheme = http) { return 308 https://$host$request_uri; } if ($host ~ ^www\.(?<domain>.+)$) { return 308 https://$domain$request_uri; }` | quote }}
    {{- end }}
    {{- if $httpAuth }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ include "shopsys.httpAuthSecretName" $ | quote }}
    nginx.ingress.kubernetes.io/auth-realm: Authentication Required - ok
    {{- if $whitelist }}
    {{- /* Whitelisted IPs may bypass the HTTP basic auth */}}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ $whitelist | quote }}
    nginx.ingress.kubernetes.io/satisfy: any
    {{- end }}
    {{- end }}
    {{- if $cloudflare }}
    nginx.ingress.kubernetes.io/server-snippet: real_ip_header CF-Connecting-IP;
    {{- end }}
    {{- with $.Values.ingress.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $d.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - hosts:
        - {{ $base | quote }}
        - {{ $redirect | quote }}
      secretName: {{ $tlsSecret }}
  rules:
    - host: {{ $base | quote }}
      http:
        paths:
          - backend:
              service:
                name: webserver-php-fpm
                port:
                  number: 8080
            path: {{ if $path }}/{{ $path }}{{ else }}/{{ end }}
            pathType: Prefix
    {{- /* The bare counterpart rule serves the redirect vhost in snippet style. In
           native style it MUST be dropped: when the counterpart host is defined as a
           rule (in any Ingress), ingress-nginx omits the from-to-www-redirect server
           entirely - the redirect would be silently dropped, not merely duplicated */}}
    {{- if ne $.Values.ingress.redirectStyle "native" }}
    - host: {{ $redirect | quote }}
    {{- end }}
{{- end }}
