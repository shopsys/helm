{{- /*
Hook-scoped copy of the app-secret-env Secret for the migration Job. Pre-install hooks
run before regular chart resources exist, and pre-upgrade hooks run before the regular
Secret is updated - referencing the regular app-secret-env would fail on the first deploy
and read stale values on upgrades. Weight 5 puts it before the migration Job (weight 10).
The post-deploy Job (post-install/post-upgrade) uses the regular Secret - by then it is
already created/updated.
*/}}
{{- if and .Values.app.secretEnv .Values.deploy.migration.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: app-secret-env-hook
  labels:
    {{- include "shopsys.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $key, $value := .Values.app.secretEnv }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
