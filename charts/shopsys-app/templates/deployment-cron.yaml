{{- if .Values.cron.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cron
  labels:
    {{- include "shopsys.labels" $ | nindent 4 }}
    app: cron
spec:
  progressDeadlineSeconds: {{ .Values.cron.progressDeadlineSeconds }}
  replicas: {{ .Values.cron.replicas }}
  strategy:
    {{- toYaml .Values.cron.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: cron
  template:
    metadata:
      annotations:
        {{- include "shopsys.podAnnotations" (dict "root" $ "app" "cron" "logging" "true" "component" .Values.cron) | nindent 8 }}
        {{- include "shopsys.checksums" (dict "root" $ "include" (list "domainsUrls" "cron")) | nindent 8 }}
      labels:
        app: cron
        # Forces a fresh cron pod on every deploy (legacy `date` label)
        date: {{ .Values.deploy.timestamp | default .Release.Revision | quote }}
        {{- with .Values.cron.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "shopsys.podSettings" (dict "root" $ "component" .Values.cron) | nindent 6 }}
      volumes:
        - name: domains-urls
          configMap:
            name: domains-urls
        - name: cron-list
          configMap:
            name: cron-list
        - name: cron-env
          configMap:
            name: cron-env
        {{- if .Values.app.secretEnv }}
        - name: cron-secret-env
          secret:
            secretName: cron-secret-env
        {{- end }}
        - name: fe-api-keys-volume
          secret:
            secretName: fe-api-keys
            defaultMode: 0644
        {{- with .Values.cron.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - image: {{ include "shopsys.image" .Values.webserver.image | quote }}
          name: cron
          {{- with .Values.cron.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.webserver.image.pullPolicy | default "IfNotPresent" }}
          workingDir: /var/www/html
          command: ["/bin/sh","-c"]
          args: ["cd /var/www/html && ./phing warmup > /dev/null && rm -rf /tmp/log-pipe && mkfifo /tmp/log-pipe && chmod 666 /tmp/log-pipe && crontab -u root /var/spool/cron/template && { crond || cron; } && stdbuf -o0 tail -n +1 -f /tmp/log-pipe"]
          # The pod drains itself before termination: cron-lock prevents the next
          # cron iteration, cron-watch waits until all running instances finish.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - '-c'
                  - "cd /var/www/html && (./phing -S cron-lock > /dev/null 2>&1 &) && ./phing -S cron-watch"
          {{- include "shopsys.appEnvFrom" $ | nindent 10 }}
          env:
            {{- include "shopsys.appEnv" (dict "root" $ "component" .Values.cron) | nindent 12 }}
          {{- with .Values.cron.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: domains-urls
              mountPath: /var/www/html/{{ .Values.app.domainsUrls.mountPath }}
              subPath: {{ .Values.app.domainsUrls.filename | quote }}
            - name: cron-list
              mountPath: /var/spool/cron/template
              subPath: cron
            - name: cron-env
              mountPath: /root/.project_env.sh
              subPath: .project_env.sh
            {{- if .Values.app.secretEnv }}
            - name: cron-secret-env
              mountPath: /root/.project_secret_env.sh
              subPath: .project_secret_env.sh
            {{- end }}
            - name: fe-api-keys-volume
              readOnly: true
              mountPath: /var/www/html/config/frontend-api
            {{- with .Values.cron.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      terminationGracePeriodSeconds: {{ .Values.cron.terminationGracePeriodSeconds }}
{{- end }}
