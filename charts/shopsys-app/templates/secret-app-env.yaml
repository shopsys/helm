{{- /*
Sensitive backend environment variables (app.secretEnv) delivered as a Secret and
consumed via envFrom by the webserver, cron, consumers and the hook Jobs - they never
appear in pod specs or ConfigMaps. Cron jobs additionally source the exported shell
form from the .project_secret_env.sh key (crond scrubs the container environment).
*/}}
{{- if .Values.app.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: app-secret-env
  labels:
    {{- include "shopsys.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.app.secretEnv }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
{{- if .Values.cron.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cron-secret-env
  labels:
    {{- include "shopsys.labels" $ | nindent 4 }}
type: Opaque
stringData:
  .project_secret_env.sh: |
    {{- include "shopsys.cronSecretEnv.data" . | nindent 4 }}
{{- end }}
{{- end }}
