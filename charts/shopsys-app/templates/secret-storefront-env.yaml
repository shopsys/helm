{{- /*
Sensitive storefront environment variables (storefront.secretEnv) delivered as a Secret
and consumed via envFrom by the storefront container.
*/}}
{{- if .Values.storefront.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: storefront-secret-env
  labels:
    {{- include "shopsys.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.storefront.secretEnv }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
