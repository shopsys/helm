{{- /*
Optional declarative FE API keypair. When not provided the deploy wrapper generates
the keypair once with openssl and creates this secret imperatively (create-once).
resource-policy keep prevents helm from deleting the keys on uninstall.
*/}}
{{- if and .Values.security.feApiKeys.privateKey .Values.security.feApiKeys.publicKey }}
apiVersion: v1
kind: Secret
metadata:
  name: fe-api-keys
  labels:
    {{- include "shopsys.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  private.key: {{ .Values.security.feApiKeys.privateKey | quote }}
  public.key: {{ .Values.security.feApiKeys.publicKey | quote }}
{{- end }}
